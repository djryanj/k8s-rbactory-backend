apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-generator-api
  namespace: default
  labels:
    app: rbac-generator-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rbac-generator-api
  template:
    metadata:
      labels:
        app: rbac-generator-api
    spec:
      serviceAccountName: rbac-generator  # Use the service account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: rbac-generator-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: ALLOWED_ORIGINS
          value: "https://your-frontend.example.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL