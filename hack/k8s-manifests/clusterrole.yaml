apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rbac-generator-reader
rules:
  # Read RBAC resources
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  
  # Read namespaces
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list"]
  
  # Read cluster version (discovery API)
  - nonResourceURLs: ["/version"]
    verbs: ["get"]