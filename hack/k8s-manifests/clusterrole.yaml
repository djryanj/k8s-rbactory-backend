apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-rbactory-reader
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list"]
  
  - nonResourceURLs: ["/version"]
    verbs: ["get"]