version: "2"

run:
  go: "1.25"
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gocritic
    - gosec
    - unconvert
    - dupl
    - goconst
    - gocyclo
    - revive

  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
